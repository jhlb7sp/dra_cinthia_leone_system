<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orçamento</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/orcamento.css" />
</head>

<body>
    <div class="card2">
        <h2>Orçamento</h2><br />
        <p><strong>Dra. Cinthia Leone</strong> | CRO: 126.543</p>

        <div class="linha-paciente">
            <div class="campo-paciente-nome">
                <label for="paciente">Nome do Paciente:</label>
                <input type="text" id="paciente" placeholder="Digite o nome" />
                <div id="sugestoes" class="autocomplete-sugestoes"></div>
            </div>

            <div class="campo-paciente-cpf">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="Digite o CPF" />
            </div>
        </div>


        <div style="margin: 30px 0;">
            <div class="linha-orcamento">

                <div class="campo">
                    <label for="procedimentoInput">Procedimento:</label>

                    <div class="autocomplete-wrap">
                        <input type="text" id="procedimentoInput" placeholder="Digite para buscar..."
                            autocomplete="off" />
                        <div id="procedimentoSugestoes" class="autocomplete-list" style="display:none;"></div>
                    </div>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo:</label>
                    <select id="tipo">
                        <option value=""></option>
                        <option value="MOD">MOD</option>
                        <option value="OD">OD</option>
                        <option value="MO">MO</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="dente">Dente:</label>
                    <input type="number" id="dente" placeholder="dente" />
                </div>

                <div class="campo">
                    <label for="valorProc">Valor:</label>
                    <input type="number" id="valorProc" placeholder="0,00" step="0.01" min="0" />
                </div>

            </div>
        </div>


        <button class="btn-add" onclick="addProcedimento()">+ Adicionar</button>

        <table id="tabelaProcedimentos" border="1" style="width: 100%; margin-top: 1px; display: none;">
            <thead>
                <tr>
                    <th>Procedimento</th>
                    <th>Tipo</th>
                    <th>Dente</th>
                    <th>Valor (R$)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td colspan="3" style="text-align: right;"><strong>Desconto (Pix ou Dinheiro) (%):</strong></td>
                    <td colspan="2">

                        <input type="number" id="desconto" style="width: 80px;" placeholder="5" value="5"
                            oninput="atualizarTabela()" />
                    </td>
                </tr>
                <tr>
                    <td colspan="3" style="text-align: right;"><strong>Parcelas:</strong></td>
                    <td colspan="2">
                        <input type="number" id="parcelas" style="width: 80px;" placeholder="2" value="2" min="2"
                            oninput="atualizarTabela()" />
                    </td>
                </tr>
                <tr>
                    <td colspan="3" style="text-align: right;"><strong>Total:</strong></td>
                    <td id="total" colspan="2">R$ 0,00</td>
                </tr>
                <tr>
                    <td colspan="5" id="valorParcela" style="text-align: right; font-weight: bold;">Em 1x de R$ 0,00
                    </td>
                <tr>
                    <td colspan="5" id="textoDesconto" style="text-align:right; font-weight: bold; color:#1f2937;"></td>
                </tr>
                </tr>
            </tfoot>
        </table>

        <button class="btn-pdf" onclick="gerarOrcamento()">Gerar Orçamento</button>
    </div>

    <script src="js/orcamento.js"></script>
    <script src="js/logo.js"></script>
    <script src="js/pdf.js"></script>
</body>

</html>
