<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Receituário</title>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    <link
        rel="stylesheet"
        href="css/receita.css"
    >

</head>


<body>


    <main class="pagina-receita">


        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <header class="cabecalho-receita">

            <div>

                <h2 id="tituloReceita">
                    Receituário
                </h2>

                <p>
                    Dra. Cinthia Leone
                    <span>•</span>
                    CRO-SP 126.543
                </p>

            </div>

        </header>


        <!-- =========================================
             CARD PRINCIPAL
        ========================================== -->

        <section class="card2">


            <!-- =========================================
                 TIPO DE RECEITA
            ========================================== -->

            <div class="tipo-receita">

                <label class="titulo-tipo">
                    Tipo de receituário (automático)
                </label>


                <div class="opcoes-receita">

                    <label class="opcao-tipo">

                        <input
                            type="radio"
                            name="tipoReceita"
                            value="simples"
                            checked
                            disabled
                        >

                        <span>
                            Simples — 1 via
                        </span>

                    </label>

                    <label class="opcao-tipo">

                        <input
                            type="radio"
                            name="tipoReceita"
                            value="antimicrobiano"
                            disabled
                        >

                        <span>
                            Antimicrobiano — 2 vias
                        </span>

                    </label>

                    <label class="opcao-tipo">

                        <input
                            type="radio"
                            name="tipoReceita"
                            value="controle_especial"
                            disabled
                        >

                        <span>
                            Controle Especial — 2 vias
                        </span>

                    </label>


                </div>

            </div>


            <!-- =========================================
                 FORMULÁRIO
            ========================================== -->

            <div class="grid-receita">


                <!-- =====================================
                     PACIENTE
                ====================================== -->

                <div class="campo campo-paciente">

                    <label for="paciente">
                        Nome do Paciente
                    </label>

                    <input
                        type="text"
                        id="paciente"
                        placeholder="Digite o nome"
                        autocomplete="off"
                    >

                    <div
                        id="sugestoes"
                        class="autocomplete-sugestoes"
                    ></div>

                </div>


                <!-- =====================================
                     CPF
                ====================================== -->

                <div class="campo campo-cpf">

                    <label for="cpf">
                        CPF
                        <span
                            id="cpfObrigatorio"
                            class="campo-obrigatorio"
                            hidden
                        >
                            *
                        </span>
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="Digite o CPF"
                    >

                </div>


                <!-- =====================================
                     ENDEREÇO
                ====================================== -->

                <div class="campo campo-endereco">

                    <label for="endereco">
                        Endereço
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Endereço do paciente"
                    >

                </div>


                <!-- =====================================
                     MEDICAMENTO
                ====================================== -->

                <div class="campo campo-medicamento">

                    <label for="medicamento">
                        Medicamento
                    </label>

                    <input
                        type="text"
                        id="medicamento"
                        placeholder="Nome do medicamento"
                        autocomplete="off"
                    >

                    <div
                        id="sugestoesMed"
                        class="autocomplete-sugestoes"
                    ></div>

                </div>


                <!-- =====================================
                     DOSAGEM
                ====================================== -->

                <div class="campo campo-dosagem">

                    <label>
                        Dosagem
                    </label>


                    <div class="dosagem-linha">


                        <select id="tomardar">

                            <option value="Tomar">
                                Tomar
                            </option>

                            <option value="Dar">
                                Dar
                            </option>

                        </select>


                        <input
                            type="number"
                            id="quantidade"
                            placeholder="Qtd"
                        >


                        <select id="unidade">

                            <option value="comprimido(s)">
                                comprimido(s)
                            </option>

                            <option value="ml">
                                ml
                            </option>

                            <option value="gota(s)">
                                gota(s)
                            </option>

                            <option value="capsula(s)">
                                capsula(s)
                            </option>

                        </select>


                        <span>de</span>


                        <select id="intervalo">

                            <option value="vazio"></option>

                            <option value="06">
                                06
                            </option>

                            <option value="08">
                                08
                            </option>

                            <option value="12">
                                12
                            </option>

                            <option value="24">
                                24
                            </option>

                        </select>


                        <span>em</span>


                        <select id="horas">

                            <option value="vazio"></option>

                            <option value="06">
                                06
                            </option>

                            <option value="08">
                                08
                            </option>

                            <option value="12">
                                12
                            </option>

                            <option value="24">
                                24
                            </option>

                        </select>


                        <span>
                            horas, durante
                        </span>


                        <select id="dias">

                            <option value=""></option>

                            <option value="01">
                                01
                            </option>

                            <option value="03">
                                03
                            </option>

                            <option value="05">
                                05
                            </option>

                            <option value="07">
                                07
                            </option>

                            <option value="10">
                                10
                            </option>

                        </select>


                        <span>
                            dias.
                        </span>


                        <select id="obs">

                            <option value=""></option>

                            <option value="se dor">
                                se dor
                            </option>

                        </select>


                    </div>

                </div>


                <!-- =====================================
                     OBSERVAÇÃO
                ====================================== -->

                <div class="campo campo-observacao">

                    <label for="observacao">
                        Observação (opcional)
                    </label>

                    <textarea
                        id="observacao"
                        rows="2"
                        placeholder="Ex: tomar após refeições / se houver dor / não dirigir..."
                    ></textarea>

                </div>


            </div>


            <!-- =========================================
                 AÇÕES
            ========================================== -->

            <div class="acoes-receita">


                <div class="assinatura-container">

                    <input
                        class="checkbox"
                        type="checkbox"
                        id="assinatura"
                    >

                    <label for="assinatura">
                        Carimbo
                    </label>

                </div>


                <button
                    class="btn-add"
                    type="button"
                    onclick="addMedicamento()"
                >
                    + Adicionar Medicamento
                </button>


                <button
                    class="btn-pdf"
                    type="button"
                    onclick="gerarReceita()"
                >
                    Gerar Receita PDF
                </button>


            </div>


            <!-- =========================================
                 LISTA DE MEDICAMENTOS
            ========================================== -->

            <div
                class="med-list"
                id="listaMedicamentos"
            ></div>


        </section>


    </main>


    <!-- =========================================
         SCRIPTS
    ========================================== -->

    <script src="js/script.js"></script>

    <script src="js/logo.js"></script>

    <script src="js/receita.js"></script>

    <script src="js/pdf.js"></script>


</body>

</html>
