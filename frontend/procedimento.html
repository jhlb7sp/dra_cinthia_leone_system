<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Procedimentos</title>
    <link rel="stylesheet" href="css/procedimentos.css">
</head>

<body>

    <div class="pagina-procedimentos">

        <div class="cabecalho-pagina">
            <div>
                <h2 id="tituloProcedimentos">
                    Procedimentos
                </h2>

                <p id="subtituloProcedimentos">
                    Cadastre e gerencie os valores dos procedimentos.
                </p>
            </div>
        </div>

        <div class="card-procedimentos">

            <div class="linha-campos">

                <div class="campo campo-nome">
                    <label for="nome">Procedimento</label>
                    <input type="text" id="nome">
                </div>

                <div class="campo campo-tipo">
                    <label for="tipo">Tipo</label>

                    <select id="tipo">
                        <option value="">Selecione</option>
                        <option value="MOD">MOD</option>
                        <option value="OD">OD</option>
                        <option value="MO">MO</option>
                    </select>
                </div>

                <div class="campo campo-dente">
                    <label for="dente">Dente</label>
                    <input type="text" id="dente">
                </div>

                <div class="campo campo-valor">
                    <label for="valorPrincipal">Principal</label>
                    <input type="text" id="valorPrincipal">
                </div>

                <div class="campo campo-valor">
                    <label for="valorDesconto">Desconto</label>
                    <input type="text" id="valorDesconto">
                </div>

                <div class="campo campo-valor">
                    <label for="valorFamilia">Família</label>
                    <input type="text" id="valorFamilia">
                </div>

                <!-- BOTÕES -->
                <div class="campo campo-botao">

                    <label>&nbsp;</label>

                    <div class="grupo-botoes">

                        <button
                            id="btnSalvar"
                            type="button"
                            class="btn-primary"
                            onclick="adicionarProcedimentos()">
                            Adicionar
                        </button>

                        <button
                            id="btnCancelar"
                            type="button"
                            class="btn-secundario"
                            onclick="limparFormulario()"
                            style="display:none;">
                            Cancelar
                        </button>

                        <button
                            type="button"
                            class="btn-secundario"
                            onclick="exportarProcedimentosExcel()">
                            Exportar Excel
                        </button>

                        <button
                            type="button"
                            class="btn-secundario"
                            onclick="abrirImportacaoExcel()">
                            Importar preços
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div class="barra-acoes">

            <div class="filtro-box">

                <label for="filtro">
                    Buscar procedimento
                </label>

                <input
                    type="text"
                    id="filtro"
                    placeholder="Digite para pesquisar..."
                    oninput="filtrarProcedimentos()">

            </div>

        </div>

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Procedimento</th>
                        <th>Tipo</th>
                        <th>Dente</th>
                        <th>Principal</th>
                        <th>Desconto</th>
                        <th>Família</th>
                        <th class="coluna-acoes">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaProcedimentos"></tbody>

            </table>

        </div>

    </div>


    <!-- =========================================
         MODAL HISTÓRICO
    ========================================== -->

    <div id="modalHistorico" class="modal-overlay">

        <div class="modal-historico">

            <div class="modal-cabecalho">

                <div>

                    <h3>Histórico de preços</h3>

                    <span id="historicoNome"></span>

                </div>

                <button
                    type="button"
                    class="btn-fechar-modal"
                    onclick="fecharHistorico()">
                    ×
                </button>

            </div>

            <div id="historicoConteudo"></div>

        </div>

    </div>


    <!-- Importação -->

    <input
        type="file"
        id="arquivoImportacao"
        accept=".xlsx,.xls"
        style="display:none"
        onchange="importarProcedimentosExcel(event)">


    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="js/procedimentos.js"></script>

</body>

</html>
