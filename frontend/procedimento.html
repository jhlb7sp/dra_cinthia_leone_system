<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Procedimentos</title>
    <link rel="stylesheet" href="css/procedimentos.css">
</head>

<body>

    <h2>Cadastro de Procedimento</h2>

    <div class="linha-campos">

        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </div>

        <div class="campo">
            <label for="tipo">Tipo:</label>
            <select id="tipo">
                <option value="">-- selecione --</option>
                <option value="MOD">MOD</option>
                <option value="OD">OD</option>
                <option value="MO">MO</option>
            </select>
        </div>

        <div class="campo">
            <label for="dente">Dente:</label>
            <input type="text" id="dente">
        </div>

        <div class="campo">
            <label for="valor">Valor:</label>
            <input type="text" id="valor">
        </div>

        <div class="campo campo-botao">
            <label>&nbsp;</label>
            <button onclick="adicionarProcedimentos()">Adicionar</button>
        </div>

    </div>


    <label for="filtro">Filtrar por procedimento:</label>
    <input type="text" id="filtro" oninput="filtrarProcedimentos()">

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Dente</th>
                <th>Valor</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabelaProcedimentos">
            <!-- Medicamentos adicionados aparecem aqui -->
        </tbody>
    </table>
    <script src="js/procedimentos.js"></script>
</body>

</html>
