<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="js/script.js"></script>
  <link rel="stylesheet" href="css/styleDoc.css">
</head>

<body>
  <div class="card2">
    <h2>Pedido - Panorâmica</h2><br>
    <p><strong>Dra. Cinthia Leone</strong> | CRO: 126.543</p>

    <label>Nome do Paciente:</label>
    <input type="text" id="paciente" placeholder="Digite o nome" style="width: 100%;">

    <div style="margin-top: 10px; text-align: left; width: 100%;">
      <button class="btn-pdf" onclick="gerarPedidoPanoramica()" style="width: 100%;">Gerar Pedido</button>
    </div>
    <div class="assinatura-container">
      <input type="checkbox" id="assinatura">
      <label for="assinatura">Carimbo</label>
    </div>

  </div>

  <script>
    document.getElementById("paciente").addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        gerarPedidoPanoramica();
      }
    });
  </script>

  <script src="libs/jspdf.umd.min.js"></script>
  <script src="js/panoramica.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/pdf.js"></script>

</body>

</html>
