<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Controle de Autoclave</title>
  <link rel="stylesheet" href="css/autoclave.css">
  <script src="js/autoclave.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
  <div class="container">
    <h2>Controle de Autoclave</h2>

    <div class="tabs">
      <button class="tablink active" onclick="openTab(event, 'fisico')">Controle Físico</button>
      <button class="tablink" onclick="openTab(event, 'biologico')">Controle Biológico</button>
    </div>

    <div id="fisico" class="tabcontent active">
      <h3>Controle Físico</h3>
      <!-- Formulário Físico -->
      <div class="formulario">
        <div class="field">
          <label>Data:</label>
          <input type="date" id="dataFisico">
        </div>

        <div class="field">
          <label>Horário:</label>
          <input type="time" id="horarioFisico">
        </div>

        <div class="field">
          <label>Operador:</label>
          <input type="text" id="operadorFisico">
        </div>

        <div class="field">
          <label>Temperatura (°C):</label>
          <input type="number" id="temperaturaFisico">
        </div>

        <div class="field">
          <label>Pressão (kgf/cm²):</label>
          <input type="number" step="0.1" id="pressaoFisico">
        </div>

        <div class="field">
          <label>Tempo (min):</label>
          <input type="number" id="tempoFisico">
        </div>

        <div class="field">
          <label>Fita Indicadora:</label>
          <input type="text" id="fitaIndicadoraFisico">
        </div>

        <div class="actions">
          <button onclick="adicionarControleFisico()">Adicionar</button>
        </div>
      </div>

      <br>
      <div class="filtros">
        <label>Data Início:</label>
        <input type="date" id="dataInicioFisico">
        <label>Data Fim:</label>
        <input type="date" id="dataFimFisico">
        <button onclick="filtrarControleFisico()">Filtrar</button>
        <button onclick="exportarControleFisicoPDF()">Exportar PDF</button>
      </div>

      <table id="tabelaFisico">
        <thead>
          <tr>
            <th>Data</th>
            <th>Horário</th>
            <th>Operador</th>
            <th>Temperatura</th>
            <th>Pressão</th>
            <th>Tempo</th>
            <th>Fita Indicadora</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="biologico" class="tabcontent">
      <h3>Controle Biológico</h3>
      <!-- Formulário Biológico -->
      <div class="formulario">
        <div class="field">
          <label>Data:</label>
          <input type="date" id="dataBiologico">
        </div>

        <div class="field">
          <label>Lote:</label>
          <input type="text" id="loteBiologico">
        </div>

        <div class="field">
          <label>Resultado:</label>
          <input type="text" id="resultadoBiologico">
        </div>

        <div class="field">
          <label>Data Leitura:</label>
          <input type="date" id="dataLeituraBiologico">
        </div>

        <div class="field">
          <label>Responsável:</label>
          <input type="text" id="responsavelLeituraBiologico">
        </div>

        <div class="field">
          <label>Observações:</label>
          <input type="text" id="observacoesBiologico">
        </div>

        <div class="actions">
          <button onclick="adicionarControleBiologico()">Adicionar</button>
        </div>
      </div>
      <br>
      <div class="filtros">
        <label>Data Início:</label>
        <input type="date" id="dataInicioBiologico">
        <label>Data Fim:</label>
        <input type="date" id="dataFimBiologico">
        <button onclick="filtrarControleBiologico()">Filtrar</button>
        <button onclick="exportarControleBiologicoPDF()">Exportar PDF</button>
      </div>

      <table id="tabelaBiologico">
        <thead>
          <tr>
            <th>Data</th>
            <th>Lote</th>
            <th>Resultado</th>
            <th>Data Leitura</th>
            <th>Responsável</th>
            <th>Observações</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
</body>

</html>
