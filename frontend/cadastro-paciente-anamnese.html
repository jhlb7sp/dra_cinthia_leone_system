<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Anamnese Médica</title>

    <link
        rel="stylesheet"
        href="css/anamnese.css"
    >

</head>


<body>


    <main class="pagina-anamnese">


        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <header class="cabecalho-pagina">

            <div>

                <h2>
                    Anamnese Médica
                </h2>

                <p>
                    Informações clínicas e histórico de saúde do paciente.
                </p>

            </div>

        </header>


        <!-- =========================================
             FORMULÁRIO
        ========================================== -->

        <form
            action="/pacientes/cadastrar"
            method="POST"
            enctype="multipart/form-data"
        >


            <input
                type="hidden"
                id="cpf"
                name="cpf"
                value=""
            >


            <!-- =====================================
                 CARD ANAMNESE
            ====================================== -->

            <section class="card-anamnese">


                <div class="grid-anamnese">


                    <!-- QUEIXA -->

                    <div class="pergunta pergunta-queixa">

                        <label for="queixa_principal">
                            Queixa principal
                        </label>

                        <select
                            name="queixa_principal"
                            id="queixa_principal"
                            required
                        >

                            <option
                                value=""
                                disabled
                                selected
                            >
                                Selecione
                            </option>

                            <option value="dor">
                                Dor
                            </option>

                            <option value="estetica">
                                Estética
                            </option>

                            <option value="prevencao">
                                Prevenção
                            </option>

                        </select>

                    </div>


                    <!-- ALERGIA -->

                    <div class="pergunta">

                        <label>
                            Tem alergia ou já teve reação a medicamento?
                        </label>


                        <div class="resposta">

                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="alergia_sim"
                                    name="alergia"
                                    value="sim"
                                >

                                <span>
                                    Sim
                                </span>

                            </label>


                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="alergia_nao"
                                    name="alergia"
                                    value="nao"
                                >

                                <span>
                                    Não
                                </span>

                            </label>


                            <input
                                type="text"
                                class="campo-texto"
                                name="alergia_qual"
                                data-name="alergia"
                                placeholder="Qual?"
                                style="display: none;"
                            >

                        </div>

                    </div>


                    <!-- GRÁVIDA -->

                    <div class="pergunta">

                        <label>
                            Está grávida?
                        </label>


                        <div class="resposta">

                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="gravida_sim"
                                    name="gravida"
                                    value="sim"
                                >

                                <span>
                                    Sim
                                </span>

                            </label>


                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="gravida_nao"
                                    name="gravida"
                                    value="nao"
                                >

                                <span>
                                    Não
                                </span>

                            </label>


                            <input
                                type="text"
                                class="campo-texto"
                                name="gravida_meses"
                                data-name="gravida"
                                placeholder="Quantos meses?"
                                style="display: none;"
                            >

                        </div>

                    </div>


                    <!-- CIRURGIA -->

                    <div class="pergunta">

                        <label>
                            Já passou por cirurgia?
                        </label>


                        <div class="resposta">

                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="cirurgia_sim"
                                    name="cirurgia"
                                    value="sim"
                                >

                                <span>
                                    Sim
                                </span>

                            </label>


                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="cirurgia_nao"
                                    name="cirurgia"
                                    value="nao"
                                >

                                <span>
                                    Não
                                </span>

                            </label>


                            <input
                                type="text"
                                class="campo-texto"
                                name="cirurgia_qual"
                                data-name="cirurgia"
                                placeholder="Qual?"
                                style="display: none;"
                            >

                        </div>

                    </div>


                    <!-- TRATAMENTO -->

                    <div class="pergunta">

                        <label>
                            Está sob algum tratamento médico?
                        </label>


                        <div class="resposta">

                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="tratamento_sim"
                                    name="tratamento"
                                    value="sim"
                                >

                                <span>
                                    Sim
                                </span>

                            </label>


                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="tratamento_nao"
                                    name="tratamento"
                                    value="nao"
                                >

                                <span>
                                    Não
                                </span>

                            </label>


                            <input
                                type="text"
                                class="campo-texto"
                                name="tratamento_qual"
                                data-name="tratamento"
                                placeholder="Qual?"
                                style="display: none;"
                            >

                        </div>

                    </div>


                    <!-- MEDICAMENTOS -->

                    <div class="pergunta">

                        <label>
                            Usa medicamentos?
                        </label>


                        <div class="resposta">

                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="medicamento_sim"
                                    name="medicamento"
                                    value="sim"
                                >

                                <span>
                                    Sim
                                </span>

                            </label>


                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="medicamento_nao"
                                    name="medicamento"
                                    value="nao"
                                >

                                <span>
                                    Não
                                </span>

                            </label>


                            <input
                                type="text"
                                class="campo-texto"
                                name="medicamento_qual"
                                data-name="medicamento"
                                placeholder="Qual?"
                                style="display: none;"
                            >

                        </div>

                    </div>


                    <!-- FUMA -->

                    <div class="pergunta">

                        <label>
                            Fuma?
                        </label>


                        <div class="resposta">

                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="fuma_sim"
                                    name="fuma"
                                    value="sim"
                                >

                                <span>
                                    Sim
                                </span>

                            </label>


                            <label class="radio-opcao">

                                <input
                                    type="radio"
                                    id="fuma_nao"
                                    name="fuma"
                                    value="nao"
                                >

                                <span>
                                    Não
                                </span>

                            </label>

                        </div>

                    </div>


                    <!-- =====================================
                         ENFERMIDADES
                    ====================================== -->

                    <div class="pergunta pergunta-enfermidades">


                        <label>
                            Sofre de alguma dessas enfermidades?
                        </label>


                        <div class="enfermidades">


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="hiv"
                                >

                                <span>
                                    HIV
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="diabetes"
                                >

                                <span>
                                    Diabetes
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="tuberculose"
                                >

                                <span>
                                    Tuberculose
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="artrite"
                                >

                                <span>
                                    Artrite
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="cardiaco"
                                >

                                <span>
                                    Problemas cardíacos
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="asma"
                                >

                                <span>
                                    Asma
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="hipertensao"
                                >

                                <span>
                                    Hipertensão
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="renais"
                                >

                                <span>
                                    Problemas renais
                                </span>

                            </label>


                            <label class="check-opcao">

                                <input
                                    type="checkbox"
                                    name="enfermidades[]"
                                    value="hepaticos"
                                >

                                <span>
                                    Problemas hepáticos
                                </span>

                            </label>


                            <div class="outros-enfermidade">

                                <label class="check-opcao">

                                    <input
                                        type="checkbox"
                                        name="enfermidades[]"
                                        value="outros"
                                    >

                                    <span>
                                        Outros
                                    </span>

                                </label>


                                <input
                                    type="text"
                                    name="enfermidade_outros"
                                    placeholder="Se outros, qual?"
                                >

                            </div>


                        </div>

                    </div>


                    <!-- =====================================
                         OBSERVAÇÕES
                    ====================================== -->

                    <div class="pergunta pergunta-observacoes">


                        <label for="observacoesGerais">
                            Observações gerais
                        </label>


                        <textarea
                            name="observacoesGerais"
                            id="observacoesGerais"
                            placeholder="Informações adicionais relevantes para o atendimento..."
                        ></textarea>


                    </div>


                </div>


                <!-- =====================================
                     AÇÕES
                ====================================== -->

                <div class="acoes-anamnese">


                    <button
                        class="btn-salvar"
                        type="submit"
                    >
                        Salvar Cadastro
                    </button>


                </div>


            </section>


        </form>


    </main>


    <script src="js/cadastropacienteanamnese.js"></script>

    <script src="js/utils.js"></script>


</body>

</html>
