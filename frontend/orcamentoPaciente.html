<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Orçamentos do Paciente</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="css/orcamentoPaciente.css">
</head>
<body>

  <div class="pagina-orcamentos">

    <div class="cabecalho-orcamentos">
      <div>
        <h2>Orçamentos</h2>
        <p id="cpfPaciente">Carregando CPF...</p>
      </div>
    </div>

    <div class="resumo-orcamentos">
      <div class="resumo-card">
        <span class="resumo-label">Orçamentos</span>
        <strong id="totalOrcamentos">-</strong>
      </div>

      <div class="resumo-card">
        <span class="resumo-label">Último orçamento</span>
        <strong id="ultimoOrcamento">-</strong>
      </div>

      <div class="resumo-card">
        <span class="resumo-label">Valor total</span>
        <strong id="valorTotalOrcamentos">-</strong>
      </div>
    </div>

    <div class="card-orcamentos">

      <div class="card-header">
        <div>
          <h3>Histórico de orçamentos</h3>
          <span>Consulte os orçamentos já gerados para este paciente.</span>
        </div>
      </div>

      <div class="tabela-wrap">
        <table id="tabelaOrcamentos">
          <thead>
            <tr>
              <th>Data</th>
              <th>Valor Total</th>
              <th>Parcelas</th>
              <th>Status</th>
              <th class="coluna-acoes">Ações</th>
            </tr>
          </thead>

          <tbody id="bodyOrcamentos">
            <tr>
              <td colspan="5" class="sem-registros">
                Carregando orçamentos...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <script src="js/logo.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/orcamentoPaciente.js"></script>
</body>
</html>
