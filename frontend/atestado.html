<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atestado Odontológico</title>

    <link rel="stylesheet" href="css/atestado.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

</head>


<body class="pagina-interna">


    <main class="pagina-atestado">


        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <header class="cabecalho-pagina">

            <div>

                <h2>
                    Atestado Odontológico
                </h2>

                <p>
                    Gere atestados de comparecimento ou afastamento.
                </p>

            </div>

        </header>


        <!-- =========================================
             CARD
        ========================================== -->

        <section class="card-atestado">


            <!-- =========================================
                 TIPO
            ========================================== -->

            <div class="tipo-atestado">

                <label class="titulo-tipo">
                    Tipo de atestado
                </label>


                <div class="opcoes-atestado">


                    <label class="opcao-tipo">

                        <input type="radio" name="tipoAtestado" value="horas" checked>

                        <span>
                            Comparecimento / Horas
                        </span>

                    </label>


                    <label class="opcao-tipo">

                        <input type="radio" name="tipoAtestado" value="dias">

                        <span>
                            Afastamento / Dias
                        </span>

                    </label>


                </div>

            </div>


            <!-- =========================================
                 FORMULÁRIO
            ========================================== -->

            <div class="grid-atestado">


                <!-- =====================================
                     LINHA 1
                ====================================== -->

                <div class="campo campo-paciente">

                    <label for="paciente">
                        Nome do Paciente
                    </label>


                    <div class="autocomplete-wrap">

                        <input type="text" id="paciente" placeholder="Digite o nome" autocomplete="off">

                        <div id="sugestoes" class="autocomplete-sugestoes"></div>

                    </div>

                </div>


                <div class="campo campo-cpf">

                    <label for="cpf">
                        CPF
                    </label>

                    <input type="text" id="cpf" placeholder="000.000.000-00">

                </div>


                <!-- =====================================
                     LINHA 2
                ====================================== -->

                <div class="campo campo-data">

                    <label for="data">
                        Data
                    </label>

                    <input type="date" id="data">

                </div>


                <div class="campo campo-entrada">

                    <label for="entrada">
                        Hora de chegada
                    </label>

                    <input type="time" id="entrada">

                </div>


                <div class="campo campo-saida">

                    <label for="saida">
                        Hora de saída
                    </label>

                    <input type="time" id="saida">

                </div>


                <div class="campo campo-dias">

                    <label for="diasrepouso">
                        Dias de repouso
                    </label>

                    <input type="number" id="diasrepouso" min="1" placeholder="Dias" disabled>

                </div>


                <!-- =====================================
                     LINHA 3 - CID
                ====================================== -->

                <div class="campo campo-permissao-cid">

                    <label class="check-cid">

                        <input type="checkbox" id="permiteCid">

                        <span>
                            Paciente autorizou inclusão do CID
                        </span>

                    </label>

                </div>


                <div class="campo campo-cid">

                    <label for="cid">
                        CID
                    </label>

                    <select id="cid" name="cid" disabled>

                        <option value="">
                            Selecione o CID
                        </option>


                        <option value="Z01.2">
                            Z01.2 - Exame odontológico de rotina
                        </option>


                        <option value="Z29.8">
                            Z29.8 - Profilaxia odontológica
                        </option>


                        <option value="Z41.8">
                            Z41.8 - Procedimentos estéticos odontológicos
                        </option>


                        <option value="Z45.8">
                            Z45.8 - Ajuste e manutenção de aparelhos ortodônticos
                        </option>


                        <option value="K00">
                            K00 - Distúrbios do desenvolvimento dos dentes e da arcada dentária
                        </option>


                        <option value="K01">
                            K01 - Dentes inclusos e impactados
                        </option>


                        <option value="K02">
                            K02 - Cárie dentária
                        </option>


                        <option value="K03">
                            K03 - Outras doenças dos tecidos duros dos dentes
                        </option>


                        <option value="K04">
                            K04 - Doenças da polpa e dos tecidos periapicais
                        </option>


                        <option value="K05">
                            K05 - Doenças gengivais e periodontais
                        </option>


                        <option value="K06">
                            K06 - Outras doenças dos tecidos de suporte dos dentes
                        </option>


                        <option value="K07">
                            K07 - Anomalias dentofaciais (inclusive maloclusões)
                        </option>


                        <option value="K08">
                            K08 - Outras alterações dos dentes e de seu suporte
                        </option>


                        <option value="K09">
                            K09 - Cistos da região oral, não classificados em outra parte
                        </option>


                        <option value="K10">
                            K10 - Outras doenças dos maxilares
                        </option>


                        <option value="K11">
                            K11 - Doenças das glândulas salivares
                        </option>


                        <option value="K12">
                            K12 - Estomatite e lesões relacionadas
                        </option>

                    </select>

                </div>


            </div>


            <!-- =========================================
                 AÇÕES
            ========================================== -->

            <div class="acoes-atestado">


                <div class="assinatura-container">

                    <input type="checkbox" id="assinatura">

                    <label for="assinatura">
                        Carimbo
                    </label>

                </div>


                <button type="button" class="btn-pdf" onclick="gerarAtestado()">
                    Gerar Atestado PDF
                </button>


            </div>


        </section>


    </main>


    <!-- =========================================
         SCRIPTS
    ========================================== -->

    <script src="js/logo.js"></script>

    <script src="js/pdf.js"></script>

    <script src="js/atestado.js"></script>


</body>

</html>
