<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Medicamentos</title>

    <link rel="stylesheet" href="css/medicamentos.css">
</head>

<body>

    <main class="container">

        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <header class="topo-pagina">

            <div>
                <h2>Cadastro de Medicamentos</h2>

                <p>
                    Cadastre e gerencie os medicamentos utilizados nos receituários.
                </p>
            </div>

        </header>


        <!-- =========================================
             CADASTRO
        ========================================== -->

        <section class="linha-campos">

            <div class="campo campo-nome">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do medicamento"
                >

            </div>


            <div class="campo campo-mg">

                <label for="mg">
                    MG
                </label>

                <input
                    type="text"
                    id="mg"
                    placeholder="Ex: 500mg"
                >

            </div>


            <div class="campo campo-categoria">

                <label for="categoria">
                    Categoria
                </label>

                <select id="categoria">
                    <option
                        value=""
                        selected
                        disabled
                    >
                        Selecione...
                    </option>

                    <option value="simples">
                        Simples
                    </option>

                    <option value="antimicrobiano">
                        Antimicrobiano
                    </option>

                    <option value="controle_especial">
                        Controle Especial
                    </option>
                </select>

            </div>


            <div class="campo campo-botao">

                <label>&nbsp;</label>

                <button
                    type="button"
                    onclick="adicionarMedicamento()"
                >
                    Adicionar
                </button>

            </div>


            <div class="campo campo-botao">

                <label>&nbsp;</label>

                <button
                    class="btn-secundario"
                    type="button"
                    onclick="abrirImportacaoMedicamentos()"
                >
                    Importar
                </button>

                <input
                    type="file"
                    id="arquivoImportacao"
                    accept=".xlsx,.xls"
                    hidden
                >

            </div>


            <div class="campo campo-botao">

                <label>&nbsp;</label>

                <button
                    class="btn-secundario"
                    type="button"
                    onclick="exportarMedicamentos()"
                >
                    Exportar
                </button>

            </div>

        </section>


        <!-- =========================================
             FILTRO
        ========================================== -->

        <section class="filtro-card">

            <div class="campo">

                <label for="filtro">
                    Filtrar por Nome
                </label>

                <input
                    type="text"
                    id="filtro"
                    placeholder="Digite para pesquisar..."
                    oninput="filtrarMedicamentos()"
                >

            </div>

        </section>


        <!-- =========================================
             TABELA
        ========================================== -->

        <section class="tabela-card">

            <div class="tabela-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Nome</th>
                            <th>MG</th>
                            <th>Categoria</th>
                            <th>Ação</th>
                        </tr>

                    </thead>

                    <tbody id="tabelaMedicamentos">
                        <!-- Medicamentos adicionados aparecem aqui -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    ></script>

    <script src="js/medicamentos.js"></script>

</body>

</html>
