<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <title>Histórico Clínico</title>

  <link rel="stylesheet" href="css/historicoPaciente.css">
</head>

<body>

  <div class="pagina-historico">

    <!-- ========================================= -->
    <!-- CABEÇALHO -->
    <!-- ========================================= -->

    <div class="cabecalho-historico">

      <div>
        <h2>Histórico Clínico</h2>

        <p id="cpfPaciente">
          Carregando CPF...
        </p>
      </div>

    </div>


    <!-- ========================================= -->
    <!-- NOVO REGISTRO -->
    <!-- ========================================= -->

    <div class="card-registro">

      <div class="card-header">

        <div>
          <h3>Novo registro</h3>

          <span>
            Registre os procedimentos realizados
            no atendimento.
          </span>
        </div>

      </div>


      <div class="form-historico">

        <!-- DATA -->

        <div class="campo campo-data">

          <label for="dataHistorico">
            Data
          </label>

          <input type="date" id="dataHistorico">

        </div>


        <!-- PROCEDIMENTO -->

        <div class="campo campo-procedimento">

          <label for="procedimentoHistorico">
            Procedimento
          </label>

          <div class="autocomplete-wrap">

            <input type="text" id="procedimentoHistorico" autocomplete="off" placeholder="Digite o procedimento...">

            <div id="listaProcedimentos" class="autocomplete-lista"></div>
            <input type="hidden" id="procedimentoId">

          </div>

        </div>


        <!-- OBSERVAÇÃO -->

        <div class="campo campo-observacao">

          <label for="observacaoHistorico">
            Observação
          </label>

          <textarea id="observacaoHistorico" rows="2" placeholder="Descreva o que foi realizado..."></textarea>

        </div>


        <!-- BOTÃO -->

        <div class="campo campo-acao">

          <button type="button" id="btnSalvarHistorico" class="btn-salvar">
            Salvar
          </button>

          <button type="button" id="btnLimparHistorico" class="btn-limpar">
            Limpar
          </button>

        </div>

      </div>

    </div>


    <!-- ========================================= -->
    <!-- HISTÓRICO -->
    <!-- ========================================= -->

    <div class="card-historico">

      <div class="card-header">

        <div>
          <h3>Evolução do paciente</h3>

          <span>
            Histórico dos atendimentos realizados.
          </span>
        </div>

      </div>


      <div class="tabela-wrap">

        <table id="tabelaHistorico">

          <thead>

            <tr>

              <th class="col-data">
                Data
              </th>

              <th class="col-procedimento">
                Procedimento
              </th>

              <th>
                Observação
              </th>

              <th class="col-acoes">
                Ações
              </th>

            </tr>

          </thead>


          <tbody id="bodyHistorico">

            <tr>

              <td colspan="4" class="sem-registros">
                Carregando histórico...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <script src="js/historicoPaciente.js"></script>

</body>

</html>
