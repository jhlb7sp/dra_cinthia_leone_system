<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Histórico do Paciente</title>
</head>
<body>

  <h2>Histórico Clínico</h2>
  <p id="cpfPaciente">Carregando CPF...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cpf = params.get('cpf');

    document.getElementById('cpfPaciente').textContent = `CPF: ${cpf}`;
  </script>

</body>
</html>
