<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastro Rápido de Paciente</title>
  <link rel="stylesheet" href="css/stylecadastro.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <div class="container">
    <h2>Cadastro Rápido de Paciente</h2>

    <form id="cadastroForm">

      <div class="form-row">
        <div class="form-group">
          <label>Nome Completo *</label>
          <input type="text" id="nome" required>
        </div>
        <div class="form-group">
          <label>CPF *</label>
          <input type="text" id="cpf" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Data de Nascimento *</label>
          <input type="date" id="dataNascimento" required>
        </div>
        <div class="form-group">
          <label>Telefone *</label>
          <input type="tel" id="telefone" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email">
        </div>
      </div>

      <h3>Endereço</h3>

      <div class="form-row">
        <div class="form-group">
          <label>CEP *</label>
          <input type="text" id="cep" maxlength="9" onblur="buscarEndereco()">
        </div>
        <div class="form-group">
          <label>Rua</label>
          <input type="text" id="rua">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Bairro</label>
          <input type="text" id="bairro">
        </div>
        <div class="form-group">
          <label>Cidade</label>
          <input type="text" id="cidade">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <input type="text" id="estado">
        </div>
        <div class="form-group">
          <label>Número *</label>
          <input type="text" id="numero">
        </div>
        <div class="form-group">
          <label>Complemento</label>
          <input type="text" id="complemento">
        </div>
      </div>
      <h3>Como conheceu o consultório?</h3>
      <div class="form-row">
        <div class="form-group">
          <input type="text" id="origem">
        </div>
      </div>


      <button type="button" onclick="salvarCadastro()">Salvar Cadastro</button>
      <button type="button" onclick="cadastroRapido()">Cadastro Rápido</button>
      <button type="button" onclick="mensagemWhatsApp()">Msg WhatsApp</button>
    </form>
    <!-- Popup WhatsApp -->
    <div id="popupWhatsApp" class="popup-overlay" style="display: none;">
      <div class="popup-box">
        <h3>Colar resposta do WhatsApp</h3>
        <textarea id="textoWhatsApp" placeholder="Cole aqui a resposta do paciente...

(msg de exemplo para enviar para o paciente)

Olá 😊

Para adiantar seu pré-cadastro, por favor me envie as informações abaixo:

Nome completo:
Data nasc:
CPF:
Telefone:
Email:
CEP:
Número residência:
Complemento:
Como conheceu o consultório:

Pode copiar e preencher nessa mesma mensagem"></textarea>

        <div class="popup-actions">
          <button type="button" onclick="processarMensagemWhatsApp()">Enviar</button>
          <button type="button" onclick="fecharPopupWhatsApp()">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="qrcode"></div>
    <a id="qrcodeLink" target="_blank"></a>


    <script src="qrcode.min.js"></script>
  </div>

  <script src="js/cadastropaciente.js"></script>
</body>

</html>
