<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Rápido de Paciente</title>

    <link rel="stylesheet" href="css/stylecadastro.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <main class="container">

        <!-- CABEÇALHO -->
        <header class="topo-cadastro">

            <div>
                <h2>Cadastro Rápido de Paciente</h2>

                <p>
                    Cadastro e atualização dos dados do paciente.
                </p>
            </div>

        </header>


        <!-- FORMULÁRIO -->
        <form id="cadastroForm" class="card-cadastro">

            <div class="grid-cadastro">

                <!-- LINHA 1 -->

                <div class="form-group campo-nome">
                    <label for="nome">Nome Completo *</label>

                    <input type="text" id="nome" required>
                </div>


                <div class="form-group campo-cpf">
                    <label for="cpf">CPF *</label>

                    <input type="text" id="cpf" required>
                </div>


                <div class="form-group campo-nascimento">
                    <label for="dataNascimento">
                        Data de Nascimento *
                    </label>

                    <input type="date" id="dataNascimento" required>
                </div>


                <div class="form-group campo-telefone">
                    <label for="telefone">Telefone *</label>

                    <input type="tel" id="telefone" required>
                </div>


                <!-- LINHA 2 -->

                <div class="form-group campo-email">
                    <label for="email">Email</label>

                    <input type="email" id="email">
                </div>


                <div class="form-group campo-cep">
                    <label for="cep">CEP *</label>

                    <input type="text" id="cep" maxlength="9" onblur="buscarEndereco()">
                </div>


                <div class="form-group campo-rua">
                    <label for="rua">Rua</label>

                    <input type="text" id="rua">
                </div>


                <div class="form-group campo-numero">
                    <label for="numero">Número *</label>

                    <input type="text" id="numero">
                </div>


                <!-- LINHA 3 -->

                <div class="form-group campo-bairro">
                    <label for="bairro">Bairro</label>

                    <input type="text" id="bairro">
                </div>


                <div class="form-group campo-cidade">
                    <label for="cidade">Cidade</label>

                    <input type="text" id="cidade">
                </div>


                <div class="form-group campo-estado">
                    <label for="estado">Estado</label>

                    <input type="text" id="estado">
                </div>


                <div class="form-group campo-complemento">
                    <label for="complemento">Complemento</label>

                    <input type="text" id="complemento">
                </div>


                <!-- LINHA 4 -->

                <div class="form-group campo-origem">
                    <label for="origem">
                        Como conheceu o consultório?
                    </label>

                    <input type="text" id="origem">
                </div>


                <!-- BOTÕES -->

                <div class="acoes-cadastro">

                    <button type="button" onclick="salvarCadastro()">
                        Salvar Cadastro
                    </button>

                    <button type="button" onclick="cadastroRapido()">
                        Cadastro Rápido
                    </button>

                    <button type="button" onclick="mensagemWhatsApp()">
                        Msg WhatsApp
                    </button>

                </div>

            </div>

        </form>


        <!-- QR CODE -->

        <div id="qrcode"></div>

        <a id="qrcodeLink" target="_blank"></a>


        <!-- POPUP WHATSAPP -->

        <div id="popupWhatsApp" class="popup-overlay" style="display: none;">

            <div class="popup-box">

                <h3>Colar resposta do WhatsApp</h3>

                <textarea id="textoWhatsApp" placeholder="Cole aqui a resposta do paciente...

(msg de exemplo para enviar para o paciente)

Olá 😊

Para adiantar seu pré-cadastro, por favor me envie as informações abaixo:

Nome completo:
Data nasc:
CPF:
Telefone:
Email:
CEP:
Número residência:
Complemento:
Como conheceu o consultório:

Pode copiar e preencher nessa mesma mensagem"></textarea>


                <div class="popup-actions">

                    <button type="button" id="btnCopiarMensagem" onclick="copiarmensagem()">
                        Copiar Mensagem
                    </button>
                    <button type="button" onclick="processarMensagemWhatsApp()">
                        Enviar
                    </button>

                    <button type="button" class="btn-secondary" onclick="fecharPopupWhatsApp()">
                        Cancelar
                    </button>

                </div>

            </div>

        </div>

    </main>


    <script src="qrcode.min.js"></script>

    <script src="js/cadastropaciente.js"></script>

</body>

</html>
