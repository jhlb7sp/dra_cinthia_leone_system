<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Materiais</title>

    <link rel="stylesheet" href="css/materiais.css">

    <script src="js/materiais.js" defer></script>
</head>

<body>

    <main class="container">

        <!-- CABEÇALHO -->
        <header class="topo-pagina">

            <div>
                <h2>Cadastro de Materiais</h2>

                <p>
                    Controle de materiais, estoque e consumo por paciente.
                </p>
            </div>

            <button
                type="button"
                id="btnNovo"
            >
                + Novo Material
            </button>

        </header>


        <!-- FORMULÁRIO -->
        <form id="formMaterial">

            <div class="campo campo-nome">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do material"
                    required
                >
            </div>


            <div class="campo campo-categoria">
                <label for="categoria">Categoria</label>

                <input
                    type="text"
                    id="categoria"
                    placeholder="Categoria"
                >
            </div>


            <div class="campo campo-unidade">
                <label for="unidade">Unidade</label>

                <input
                    type="text"
                    id="unidade"
                    placeholder="Unidade"
                >
            </div>


            <div class="campo campo-quantidade">
                <label for="quantidade">Quantidade</label>

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Qtd"
                >
            </div>


            <div class="campo campo-valor">
                <label for="valor">Valor</label>

                <input
                    type="number"
                    id="valor"
                    placeholder="R$ 0,00"
                    step="0.01"
                >
            </div>


            <div class="campo campo-paciente">
                <label for="porPaciente">Por Paciente</label>

                <input
                    type="number"
                    id="porPaciente"
                    placeholder="Qtd"
                >
            </div>


            <div class="acoes-formulario">

                <button type="submit">
                    Cadastrar
                </button>

            </div>

        </form>


        <!-- TABELA -->
        <section class="tabela-card">

            <div class="tabela-wrapper">

                <table id="tabelaMateriais">

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Unidade</th>
                            <th>Quantidade</th>
                            <th>Valor (R$)</th>
                            <th>Por Paciente</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody>
                        <!-- Registros inseridos aqui -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</body>

</html>
