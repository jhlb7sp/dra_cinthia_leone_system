<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastro de Materiais</title>
  <link rel="stylesheet" href="css/materiais.css">
  <script src="js/materiais.js" defer></script>
</head>

<body>
  <div class="container">
    <h2>Cadastro de Materiais</h2>

    <button id="btnNovo">+ Novo Material</button>

    <form id="formMaterial">
      <input type="text" id="nome" placeholder="Nome do Material" required>
      <input type="text" id="categoria" placeholder="Categoria">
      <input type="text" id="unidade" placeholder="Unidade">
      <input type="number" id="quantidade" placeholder="Quantidade">
      <input type="number" id="valor" placeholder="Valor (R$)" step="0.01">
      <input type="number" id="porPaciente" placeholder="Qtd por Paciente">
      <button type="submit">Cadastrar</button>
    </form>

    <table id="tabelaMateriais">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Categoria</th>
          <th>Unidade</th>
          <th>Quantidade</th>
          <th>Valor (R$)</th>
          <th>Por Paciente</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <!-- Registros inseridos aqui -->
      </tbody>
    </table>
  </div>
</body>

</html>
