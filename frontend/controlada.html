<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="css/receita.css">
</head>

<body>
  <div class="card2">
    <h2>Receituário - Controlado</h2><br>
    <p><strong>Dra. Cinthia Leone</strong> | CRO: 126.543</p>

    <label>Nome do Paciente:</label>
    <input type="text" id="paciente" placeholder="Digite o nome" style="width: 700px;">
    <div id="sugestoes" class="autocomplete-sugestoes"></div>

    <label>CPF:</label>
    <input type="text" id="cpf" placeholder="Digite o CPF">
    <label>Endereço:</label>
    <input type="text" id="endereco" name="endereco" placeholder="Endereço do paciente">

    <label>Medicamento:</label>
    <input type="text" id="medicamento" placeholder="Nome do medicamento">
    <div id="sugestoesMed" class="autocomplete-sugestoes"></div>

    <label>Dosagem:</label>
    <label2>
      <div style="margin-bottom: 15px;">
        <select id="tomardar" style="width: 70px;">
          <option value="Tomar">Tomar</option>
          <option value="Dar">Dar</option>
        </select>
        <input type="number" id="quantidade" style="width: 60px;" placeholder="Qtd">

        <select id="unidade" style="width: 127px;">
          <option value="comprimido(s)">comprimido(s)</option>
          <option value="ml">ml</option>
          <option value="gota(s)">gota(s)</option>
          <option value="capsula(s)">capsula(s)</option>
        </select>
        de
        <select id="intervalo" style="width: 60px;">
          <option value="vazio"></option>
          <option value="06">06</option>
          <option value="08">08</option>
          <option value="12">12</option>
          <option value="24">24</option>
        </select>
        em
        <select id="horas" style="width: 60px;">
          <option value="vazio"></option>
          <option value="06">06</option>
          <option value="08">08</option>
          <option value="12">12</option>
          <option value="24">24</option>
        </select> horas, durante
        <select id="dias" style="width: 60px;">
          <option value=""></option>
          <option value="01">01</option>
          <option value="03">03</option>
          <option value="05">05</option>
          <option value="07">07</option>
          <option value="10">10</option>
        </select>
        dias.
        <select id="obs" style="width: 80px;">
          <option value=""></option>
          <option value="se dor" placeholder="opcional">se dor</option>
        </select>
      </div>
      <!-- Observação (opcional) -->
      <label style="display:block; margin-top: 8px;">Observação (opcional):</label>
      <textarea id="observacao" rows="2" placeholder="Ex: tomar após refeições / se houver dor / não dirigir..."
        style="width: 100%; resize: none; padding: 10px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box;"></textarea>

    </label2>

    <button class="btn-add" onclick="addMedicamento()">+ Adicionar Medicamento</button>

    <div class="med-list" id="listaMedicamentos"></div>

    <button class="btn-pdf" onclick="gerarPDF()">Gerar Receita PDF</button>
    <div class="assinatura-container">
      <input class="checkbox" type="checkbox" id="assinatura">
       <label for="assinatura">Carimbo</label>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/receitacontrolada.js"></script>
  <script src="js/pdf.js"></script>

</body>

</html>
