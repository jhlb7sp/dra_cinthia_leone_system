<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/atestado.css">
</head>

<body class="pagina-interna">
    <div class="card2">
        <h2>Atestado horas</h2><br>
        <p><strong>Dra. Cinthia Leone</strong> | CRO: 126.543</p>

        <label>Nome do Paciente:
            <input type="text" id="paciente" placeholder="Digite o nome" style="width: 500px;">
            <div id="sugestoes" class="autocomplete-sugestoes" style="width: 630px;"></div>
        </label>
        <label>CPF:
            <input type="text" id="cpf" placeholder="Digite o CPF" style="width: 200px;">
        </label>
        <label>
            Data:
            <input type="date" id="data" style="width: 120px;" placeholder="dias">
        </label>

        <label>
            Horarios de chegada:
            <input type="time" id="entrada" style="width: 85px;" placeholder="horas">
        </label>
        <label>Horário de saída:
            <input type="time" id="saida" style="width: 85px;" placeholder="horas">
        </label>
        <label for="cid">CID:
            <select id="cid" name="cid">
                <option value="Z01.2">Z01.2 - Exame odontológico de rotina</option>
                <option value="Z29.8">Z29.8 - Profilaxia odontológica</option>
                <option value="Z41.8">Z41.8 - Procedimentos estéticos odontológicos</option>
                <option value="Z45.8">Z45.8 - Ajuste e manutenção de aparelhos ortodônticos</option>
                <option value="K00">K00 - Distúrbios do desenvolvimento dos dentes e da arcada dentária</option>
                <option value="K01">K01 - Dentes inclusos e impactados</option>
                <option value="K02">K02 - Cárie dentária</option>
                <option value="K03">K03 - Outras doenças dos tecidos duros dos dentes</option>
                <option value="K04">K04 - Doenças da polpa e dos tecidos periapicais</option>
                <option value="K05">K05 - Doenças gengivais e periodontais</option>
                <option value="K06">K06 - Outras doenças dos tecidos de suporte dos dentes</option>
                <option value="K07">K07 - Anomalias dentofaciais (inclusive maloclusões)</option>
                <option value="K08">K08 - Outras alterações dos dentes e de seu suporte</option>
                <option value="K09">K09 - Cistos da região oral, não classificados em outra parte</option>
                <option value="K10">K10 - Outras doenças dos maxilares</option>
                <option value="K11">K11 - Doenças das glândulas salivares</option>
                <option value="K12">K12 - Estomatite e lesões relacionadas</option>
                <option value="vazio">.</option>
            </select></label>

        <button class="btn-pdf" onclick="atestadohoras()">Atestado Horas</button>
        <div class="assinatura-container">
            <input class="checkbox" type="checkbox" id="assinatura">
            <label for="assinatura">Carimbo</label>
        </div>
    </div>
    <script src="libs/jspdf.umd.min.js"></script>
    <script src="js/horas.js"></script>
    <script src="js/logo.js"></script>
    <script src="js/pdf.js"></script>

</body>

</html>
